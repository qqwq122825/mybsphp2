<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#173474">
    <title>MyBsPHP2 卡密激活模拟</title>
    <style>
        :root{font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#18213d;background:#eef3fb}
        *{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 12% 8%,#dbe7ff,transparent 34rem),#eef3fb}
        main{width:min(1080px,100%);display:grid;grid-template-columns:.88fr 1.12fr;overflow:hidden;border:1px solid #dde5f2;border-radius:26px;background:#fff;box-shadow:0 28px 80px #294b7f24}
        .intro{padding:52px;color:#fff;background:linear-gradient(150deg,#173474,#101c3e)}.mark{display:grid;width:50px;height:50px;place-items:center;border-radius:15px;background:#fff;color:#244fc7;font-weight:900}.intro h1{margin:90px 0 18px;font-size:44px;line-height:1.1}.intro p{color:#bac8e9;line-height:1.8}.intro small{display:block;margin-top:80px;color:#8097c9}
        .panel{padding:52px}.panel h2{margin:0;font-size:30px}.panel>p{color:#68738f}.form{display:grid;gap:17px;margin-top:30px}label{display:grid;gap:8px;font-size:13px;font-weight:750}input{height:50px;border:1px solid #d7deeb;border-radius:12px;padding:0 14px;font:inherit;outline:0}input:focus{border-color:#3867e8;box-shadow:0 0 0 4px #3867e819}button{height:52px;border:0;border-radius:12px;color:#fff;background:linear-gradient(135deg,#426fe9,#2f5ddd);font:inherit;font-weight:800;cursor:pointer}
        .result{display:none;margin-top:22px;padding:18px;border-radius:14px;background:#f5f8ff;white-space:pre-wrap;word-break:break-all;font:12px/1.7 ui-monospace,SFMono-Regular,monospace}.result.ok{display:block;border:1px solid #bfe7d6;background:#f1fbf7}.result.bad{display:block;border:1px solid #f2c8cd;background:#fff5f6;color:#9d3440}
        @media(max-width:760px){body{padding:0}main{min-height:100vh;grid-template-columns:1fr;border:0;border-radius:0}.intro{display:none}.panel{padding:42px 22px}}
    </style>
</head>
<body>
<main>
    <section class="intro">
        <div class="mark">BS</div>
        <h1>卡密激活<br>模拟客户端</h1>
        <p>用于验证手动发出的卡密、首次激活、到期时间、设备绑定、核心业务值和每日签名。</p>
        <small>Static HTML · REST v2 Fixture</small>
    </section>
    <section class="panel">
        <h2>模拟激活</h2>
        <p>从后台“手动发卡”复制卡号与密码。</p>
        <form class="form" id="activate-form">
            <label>卡号<input name="code" autocomplete="off" placeholder="例如 BS..." required></label>
            <label>卡密密码<input name="secret" autocomplete="off" placeholder="卡密密码" required></label>
            <label>设备标识<input name="device_id" value="IOS-DEMO-DEVICE-001" maxlength="160"></label>
            <label>appsafecode<input name="appsafecode" value="demo-safe-code" maxlength="255"></label>
            <button type="submit">发送激活请求</button>
        </form>
        <div class="result" id="result" aria-live="polite"></div>
    </section>
</main>
<script>
const form=document.querySelector('#activate-form');const result=document.querySelector('#result');
form.addEventListener('submit',async(event)=>{event.preventDefault();result.className='result';result.textContent='正在请求…';
const payload=Object.fromEntries(new FormData(form).entries());
try{const response=await fetch('/api/v2/demo/activate',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(payload)});
const json=await response.json();result.className='result '+(json.ok?'ok':'bad');result.textContent=JSON.stringify(json,null,2)}
catch(error){result.className='result bad';result.textContent='请求失败：'+error.message}});
</script>
</body>
</html>
