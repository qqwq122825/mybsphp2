<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>付款接口测试</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link href="/static/common/bootstrap.min.css" rel="stylesheet" type="text/css">
    <style>
    html,body,div,p,span,ul,dl,ol,h1,h2,h3,h4,h5,h6,table,td,tr{padding:0;margin:0}
    .content{width:360px;padding:30px 20px;margin:auto}
    h1{background-color:#004690;color:#fff;font-size:1.3em;font-weight:300;border-bottom:1px solid #ddd;padding:12px 0;text-align:center}
    table{border-collapse:collapse;width:90%;margin:20px auto}
    table tr td{height:40px;font-size:14px}
    input,select{width:100%;line-height:25px}
    button{font-size:16px}
    </style>
</head>
<body>
<h1>非点卡付款接口测试</h1>
<div class="content">
    <form action="pay.php" method="post">
        <div class="form-group">
            <label>版本号:</label>
            <input type="input" class="form-control" name="version" value="1.0">
        </div>

        <div class="form-group">
            <label>订单金额：</label>
            <input type="input" class="form-control" name="total_fee" value="1.00">
        </div>

        <div class="form-group">
            <label>支付编号：</label>
            <select class="form-control" name="paytype" onchange="changePay(this.options[this.selectedIndex].value)">
                <option value="bank">网银直连</option>
                <option value="alipay">支付宝</option>
                <option value="tenpay">财付通</option>
                <option value="wxscan">微信扫码</option>
                <option value="aliwap">支付宝wap</option>
                <option value="tenwap">财付通wap</option>
                <option value="qqscan">手Q扫码</option>
                <option value="wxwap">微信wap</option>
                <option value="qqwap">QQ钱包wap</option>
                <option value="aliscan">支付宝扫码</option>
                <option value="wxgzh">微信公众号</option>
            </select>
        </div>

        <div class="form-group" id="bankcode">
            <label>银行编号：</label>
            <select class="form-control" name="bankcode">
                <option value="ICBC">中国工商银行</option>
                <option value="ABC">中国农业银行</option>
                <option value="BOCSH">中国银行</option>
                <option value="CCB">建设银行</option>
                <option value="CMB">招商银行</option>
                <option value="SPDB">浦发银行</option>
                <option value="GDB">广发银行</option>
                <option value="BOCOM">交通银行</option>
                <option value="PSBC">邮政储蓄银行</option>
                <option value="CNCB">中信银行</option>
                <option value="CMBC">民生银行</option>
                <option value="CEB">光大银行</option>
                <option value="HXB">华夏银行</option>
                <option value="CIB">兴业银行</option>
                <option value="BOS">上海银行</option>
                <option value="SRCB">上海农商</option>
                <option value="PAB">平安银行</option>
                <option value="BCCB">北京银行</option>
            </select>
        </div>

        <div class="form-group">
            <label>异步通知URL：</label>
            <input type="text" class="form-control" name="notifyurl" value="http://www.guupay.com/gopay/pay/notify.php">
        </div>

        <div class="form-group">
            <label>同步跳转URL：</label>
            <input type="text" class="form-control" name="returnurl" value="http://www.guupay.com/gopay/pay/return.php">
        </div>

        <div class="form-group">
            <label>二维码链接：</label>
            <select class="form-control" name="is_qrcode">
                <option value="0">否</option>
                <option value="1">是</option>
            </select>
        </div>

        <div class="form-group">
            <label>订单备注：</label>
            <input type="text" class="form-control" name="remark" value="">
        </div>

        <div class="form-group">
            <button class="btn btn-block btn-success" type="submit">提交测试</button>
        </div>
    </form>
</div>
<script>
function changePay(pname){
    document.getElementById('bankcode').style.display='none';
    if(pname=='bank'){
        document.getElementById('bankcode').style.display='';
    }
}
</script>
</body>
</html>
